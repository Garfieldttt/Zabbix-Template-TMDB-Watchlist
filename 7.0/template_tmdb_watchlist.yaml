zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 54c874c18a874ba0a8b48fc694616da4
      name: Templates/Applications
  templates:
    - uuid: 593ca72fa8b643ab85b55e9dd4d2ec8a
      template: 'TMDB Watchlist by HTTP'
      name: 'TMDB Watchlist by HTTP'
      description: 'Monitors TV series and movies from a TMDB watchlist via API v3. Discovers entries via LLD and tracks season count, episode count, next/last episode air date, release dates, production status, runtime and physical/digital releases. Author: Thomas Rzen. https://github.com/Garfieldttt/Zabbix-Template-TMDB-Watchlist'
      groups:
        - name: Templates/Applications
      items:
        - uuid: bd9637621abe45369b6230b88ef11bb1
          name: 'TMDB: Watchlist series count'
          type: DEPENDENT
          key: tmdb.watchlist.count
          delay: '0'
          description: 'Total number of TV series currently in the TMDB watchlist (series only, movie count is tracked separately). The no-data trigger fires if the TMDB API stops responding.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.body.total_results
          master_item:
            key: tmdb.watchlist.raw
          tags:
            - tag: component
              value: tmdb
        - uuid: 805bbc53f3234b9485a1ba7221b60e3a
          name: 'TMDB: Watchlist movies count'
          type: DEPENDENT
          key: tmdb.watchlist.movies.count
          delay: '0'
          description: 'Total number of movies currently in the TMDB watchlist (movies only, series count is tracked separately).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.body.total_results
          master_item:
            key: tmdb.watchlist.movies.raw
          tags:
            - tag: component
              value: tmdb
        - uuid: 8e0b1c66909e43839abc28f4f3377862
          name: 'TMDB: Watchlist movies total pages'
          type: DEPENDENT
          key: tmdb.watchlist.movies.pages
          delay: '0'
          description: 'Total number of pages in the movie watchlist. Each page holds up to 20 entries. If this exceeds 1, entries beyond page 1 are not monitored.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.body.total_pages
          master_item:
            key: tmdb.watchlist.movies.raw
          tags:
            - tag: component
              value: tmdb
        - uuid: de13acba43e34277b493bab6d7c199c3
          name: 'TMDB: Watchlist movies raw'
          type: HTTP_AGENT
          key: tmdb.watchlist.movies.raw
          delay: 1h
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Fetches the movie watchlist from TMDB API (page 1, up to 20 entries). Used as master item for movie discovery and dependent items.'
          url: 'https://api.themoviedb.org/3/account/{$TMDB.ACCOUNT_ID}/watchlist/movies?api_key={$TMDB.API_KEY}&session_id={$TMDB.SESSION_ID}&page=1'
          output_format: JSON
          tags:
            - tag: component
              value: tmdb
        - uuid: 15a2950af0e041fd9f1f539b5352686f
          name: 'TMDB: Watchlist raw'
          type: HTTP_AGENT
          key: tmdb.watchlist.raw
          delay: 1h
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Fetches the TV series watchlist from TMDB API (page 1, up to 20 entries). Used as master item for series discovery and dependent items.'
          url: 'https://api.themoviedb.org/3/account/{$TMDB.ACCOUNT_ID}/watchlist/tv?api_key={$TMDB.API_KEY}&session_id={$TMDB.SESSION_ID}&page=1'
          output_format: JSON
          tags:
            - tag: component
              value: tmdb
          triggers:
            - uuid: 7d3063b9bb7342e28681ced83d97db44
              expression: 'nodata(/TMDB Watchlist by HTTP/tmdb.watchlist.raw,7200)=1'
              name: 'TMDB: No data received'
              priority: WARNING
              description: 'No data has been received from the TMDB API for more than 2 hours. Check API key, session ID, account ID, and network connectivity.'
              manual_close: 'YES'
        - uuid: 7879bc958d354d35a7038ea1a7ded4d0
          name: 'TMDB: Watchlist series total pages'
          type: DEPENDENT
          key: tmdb.watchlist.series.pages
          delay: '0'
          description: 'Total number of pages in the TV series watchlist. Each page holds up to 20 entries. If this exceeds 1, entries beyond page 1 are not monitored.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.body.total_pages
          master_item:
            key: tmdb.watchlist.raw
          tags:
            - tag: component
              value: tmdb
      discovery_rules:
        - uuid: df494a411e0240e9a37a2acbd863915e
          name: 'TMDB: Watchlist series discovery'
          type: DEPENDENT
          key: tmdb.watchlist.discovery
          delay: '0'
          description: 'Discovers all TV series from the TMDB watchlist (page 1, up to 20 entries). Creates items and triggers for each discovered series.'
          item_prototypes:
            - uuid: 763ba34fa3a54309ac4e7b431db97127
              name: 'TMDB: {#SERIES_NAME} days since last air'
              type: DEPENDENT
              key: 'tmdb.series.days_since_last_air[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              units: days
              description: 'Days elapsed since the most recently aired episode. Returns -1 if no air date is known. Used to detect series that are in production but have gone quiet.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!value || value == 0) return -1;
                      return (Date.now() / 1000 - parseInt(value)) / 86400;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.last_air_date[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
            - uuid: 56a3221c6d6d4939ade8923286eabe40
              name: 'TMDB: {#SERIES_NAME} in production'
              type: DEPENDENT
              key: 'tmdb.series.in_production[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'Indicates whether the series is currently in active production. Displayed via value map as "In production" or "Not in production". Triggers when the value transitions to 1.'
              valuemap:
                name: 'TMDB In Production Status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.in_production
                - type: BOOL_TO_DECIMAL
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
              trigger_prototypes:
                - uuid: e09d13f0214c4b78af5dd263455f9da5
                  expression: 'change(/TMDB Watchlist by HTTP/tmdb.series.in_production[{#SERIES_ID}])=1 and last(/TMDB Watchlist by HTTP/tmdb.series.in_production[{#SERIES_ID}])=1'
                  name: 'TMDB: [{#SERIES_NAME}] production started'
                  event_name: 'TMDB: {#SERIES_NAME} is now in production'
                  priority: INFO
                  description: 'The series has transitioned to in_production=true. A new season or continuation is actively being produced.'
                  manual_close: 'YES'
            - uuid: b906afc17bf24e55853abe12aca3d757
              name: 'TMDB: {#SERIES_NAME} last air date'
              type: DEPENDENT
              key: 'tmdb.series.last_air_date[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              units: unixtime
              valuemap:
                name: 'TMDB Timestamp'
              description: 'Date of the most recently aired episode as a Unix timestamp. Returns 0 if no episode has aired yet. Used to detect series that are in production but have not aired in a long time.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.last_air_date
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!value || value === '0') return 0;
                      var d = new Date(value + 'T00:00:00Z');
                      return Math.floor(d.getTime() / 1000);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
              trigger_prototypes:
                - uuid: d87d054916d9457d9361036bf60553f6
                  expression: 'change(/TMDB Watchlist by HTTP/tmdb.series.last_air_date[{#SERIES_ID}])=1 and last(/TMDB Watchlist by HTTP/tmdb.series.last_air_date[{#SERIES_ID}])>0'
                  name: 'TMDB: {#SERIES_NAME} new episode aired'
                  event_name: 'TMDB: {#SERIES_NAME} S{?last(/TMDB Watchlist by HTTP/tmdb.series.last_episode_season[{#SERIES_ID}])}E{?last(/TMDB Watchlist by HTTP/tmdb.series.last_episode_number[{#SERIES_ID}])} aired on {?strftime("%Y-%m-%d",last(/TMDB Watchlist by HTTP/tmdb.series.last_air_date[{#SERIES_ID}]))}'
                  opdata: 'S{?last(/TMDB Watchlist by HTTP/tmdb.series.last_episode_season[{#SERIES_ID}])}E{?last(/TMDB Watchlist by HTTP/tmdb.series.last_episode_number[{#SERIES_ID}])}: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: 'A new episode has aired. The last_air_date has changed to a newer value.'
                  manual_close: 'YES'
            - uuid: bbabc15acc5749758368b0cc12061bc8
              name: 'TMDB: {#SERIES_NAME} next episode air date'
              type: DEPENDENT
              key: 'tmdb.series.next_episode[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              units: unixtime
              valuemap:
                name: 'TMDB Timestamp'
              description: 'Air date of the next scheduled episode as a Unix timestamp. Returns 0 if no next episode is announced (displays as 1970-01-01 in Zabbix, use the trigger to detect date changes instead of watching the raw value).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.next_episode_to_air.air_date
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!value || value === '0') return 0;
                      var d = new Date(value + 'T00:00:00Z');
                      return Math.floor(d.getTime() / 1000);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
              trigger_prototypes:
                - uuid: b1ce24ad5df14a9494acbc483403b3ec
                  expression: 'change(/TMDB Watchlist by HTTP/tmdb.series.next_episode[{#SERIES_ID}])=1 and last(/TMDB Watchlist by HTTP/tmdb.series.next_episode[{#SERIES_ID}])>0'
                  name: 'TMDB: {#SERIES_NAME} next episode date changed'
                  event_name: 'TMDB: {#SERIES_NAME} S{?last(/TMDB Watchlist by HTTP/tmdb.series.next_episode_season[{#SERIES_ID}])}E{?last(/TMDB Watchlist by HTTP/tmdb.series.next_episode_number[{#SERIES_ID}])} on {?strftime("%Y-%m-%d",last(/TMDB Watchlist by HTTP/tmdb.series.next_episode[{#SERIES_ID}]))}'
                  opdata: 'S{?last(/TMDB Watchlist by HTTP/tmdb.series.next_episode_season[{#SERIES_ID}])}E{?last(/TMDB Watchlist by HTTP/tmdb.series.next_episode_number[{#SERIES_ID}])}: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: 'The next episode air date has been set or updated. Fires only when the new value is a valid date (not 0).'
                  manual_close: 'YES'
            - uuid: 379cea8e8ce44ba386cae592721d2ed8
              name: 'TMDB: {#SERIES_NAME} next episode number'
              type: DEPENDENT
              key: 'tmdb.series.next_episode_number[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'Episode number of the next episode to air within its season. Returns 0 if no next episode is announced. Used in trigger event names to show S__E__ notation.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.next_episode_to_air.episode_number
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
            - uuid: fdf3b26b4c3f4154b2e466dfd2bdc6d4
              name: 'TMDB: {#SERIES_NAME} next episode season'
              type: DEPENDENT
              key: 'tmdb.series.next_episode_season[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'Season number of the next episode to air. Returns 0 if no next episode is announced. Used in trigger event names to show S__E__ notation.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.next_episode_to_air.season_number
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
            - uuid: 39a0088d6b1149b2886a72738d95ad81
              name: 'TMDB: {#SERIES_NAME} last episode season'
              type: DEPENDENT
              key: 'tmdb.series.last_episode_season[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'Season number of the most recently aired episode. Returns 0 if no episode has aired. Used in trigger event names to show S__E__ notation.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.last_episode_to_air.season_number
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
            - uuid: 2d75de92d1a8452ebe179d2d0c78acc3
              name: 'TMDB: {#SERIES_NAME} last episode number'
              type: DEPENDENT
              key: 'tmdb.series.last_episode_number[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'Episode number of the most recently aired episode within its season. Returns 0 if no episode has aired. Used in trigger event names to show S__E__ notation.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.last_episode_to_air.episode_number
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
            - uuid: 5735608341eb442795f9a05909cbd5c1
              name: 'TMDB: {#SERIES_NAME} episode count'
              type: DEPENDENT
              key: 'tmdb.series.episode_count[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'Total number of episodes across all seasons. Increases when a new episode is added to TMDB (often before it airs).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.number_of_episodes
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
              trigger_prototypes:
                - uuid: 47438ad60b0b480092eb42489958174b
                  expression: 'change(/TMDB Watchlist by HTTP/tmdb.series.episode_count[{#SERIES_ID}])>=1'
                  name: 'TMDB: {#SERIES_NAME} new episode added'
                  event_name: 'TMDB: {#SERIES_NAME} S{?last(/TMDB Watchlist by HTTP/tmdb.series.next_episode_season[{#SERIES_ID}])}E{?last(/TMDB Watchlist by HTTP/tmdb.series.next_episode_number[{#SERIES_ID}])} added – airs: {?strftime("%Y-%m-%d",last(/TMDB Watchlist by HTTP/tmdb.series.next_episode[{#SERIES_ID}]))}'
                  opdata: '{ITEM.LASTVALUE1} episodes total'
                  priority: INFO
                  description: 'The total episode count has increased. A new episode has been added to TMDB.'
                  manual_close: 'YES'
            - uuid: 410edaa153544650ac49ad8556b9134b
              name: 'TMDB: {#SERIES_NAME} vote average'
              type: DEPENDENT
              key: 'tmdb.series.vote_average[{#SERIES_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'Current TMDB user rating (0-10). Informational only, no trigger.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.vote_average
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
            - uuid: 6c253cddf4b1409396e711926d6c2ee0
              name: 'TMDB: {#SERIES_NAME} raw'
              type: HTTP_AGENT
              key: 'tmdb.series.raw[{#SERIES_ID}]'
              delay: 2h
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Fetches full series details from TMDB API including season count, production status, and next episode information. Master item for all dependent series metrics.'
              url: 'https://api.themoviedb.org/3/tv/{#SERIES_ID}?api_key={$TMDB.API_KEY}&language=de-DE'
              output_format: JSON
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
            - uuid: 5b76132ab69f46dd83cb353cbb214c10
              name: 'TMDB: {#SERIES_NAME} season count'
              type: DEPENDENT
              key: 'tmdb.series.seasons[{#SERIES_ID}]'
              delay: '0'
              description: 'Number of seasons currently listed for this series on TMDB. An increase triggers a new season announcement alert.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.number_of_seasons
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
              trigger_prototypes:
                - uuid: 92b458cf6e1d40bea73113cedb3fba14
                  expression: 'change(/TMDB Watchlist by HTTP/tmdb.series.seasons[{#SERIES_ID}])>={$TMDB.SEASON.NEW_TRIGGER}'
                  name: 'TMDB: {#SERIES_NAME} new season announced'
                  event_name: 'TMDB: {#SERIES_NAME} season count: {ITEM.LASTVALUE1} – next episode: {?strftime("%Y-%m-%d",last(/TMDB Watchlist by HTTP/tmdb.series.next_episode[{#SERIES_ID}]))}'
                  opdata: '{ITEM.LASTVALUE1} seasons'
                  priority: INFO
                  description: 'The season count for this series has increased by at least {$TMDB.SEASON.NEW_TRIGGER}. A new season has been announced on TMDB.'
                  manual_close: 'YES'
            - uuid: e49d2ef65ccb40729f7c630ea959f175
              name: 'TMDB: {#SERIES_NAME} status'
              type: DEPENDENT
              key: 'tmdb.series.status[{#SERIES_ID}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: 'Current production status of the series as reported by TMDB (e.g. Returning Series, Ended, Canceled, In Production).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.body.status
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'tmdb.series.raw[{#SERIES_ID}]'
              tags:
                - tag: component
                  value: tmdb
                - tag: series
                  value: '{#SERIES_NAME}'
              trigger_prototypes:
                - uuid: c0639749dd4c44f38106395b6c5ba4ee
                  expression: 'change(/TMDB Watchlist by HTTP/tmdb.series.status[{#SERIES_ID}])=1 and last(/TMDB Watchlist by HTTP/tmdb.series.status[{#SERIES_ID}])="Canceled"'
                  name: 'TMDB: {#SERIES_NAME} cancelled'
                  event_name: 'TMDB: {#SERIES_NAME} status: Canceled'
                  priority: WARNING
                  description: 'The series status on TMDB has changed to Canceled.'
                  manual_close: 'YES'
                - uuid: 30070ef597244abd966083e04cb02618
                  expression: 'change(/TMDB Watchlist by HTTP/tmdb.series.status[{#SERIES_ID}])=1 and last(/TMDB Watchlist by HTTP/tmdb.series.status[{#SERIES_ID}])="Ended"'
                  name: 'TMDB: {#SERIES_NAME} ended'
                  event_name: 'TMDB: {#SERIES_NAME} status: Ended'
                  priority: WARNING
                  description: 'The series status on TMDB has changed to Ended.'
                  manual_close: 'YES'
          trigger_prototypes:
            - uuid: 24b1a6c99e75424499b765034002a9df
              expression: 'last(/TMDB Watchlist by HTTP/tmdb.series.days_since_last_air[{#SERIES_ID}])>{$TMDB.SERIES.STALE_DAYS} and last(/TMDB Watchlist by HTTP/tmdb.series.in_production[{#SERIES_ID}])=1'
              name: 'TMDB: {#SERIES_NAME} no new episode for {$TMDB.SERIES.STALE_DAYS} days (in production)'
              event_name: 'TMDB: {#SERIES_NAME} stale, in production, no new episode for {$TMDB.SERIES.STALE_DAYS}+ days'
              opdata: '{ITEM.LASTVALUE1} days without new episode'
              priority: WARNING
              description: 'The series is marked as in production but no new episode has aired in {$TMDB.SERIES.STALE_DAYS} days.'
              manual_close: 'YES'
          master_item:
            key: tmdb.watchlist.raw
          lld_macro_paths:
            - lld_macro: '{#SERIES_ID}'
              path: $.id
            - lld_macro: '{#SERIES_NAME}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.body.results
        - uuid: 07c3fba66c6c4878bc23b4b9985129f1
          name: 'TMDB: Movie watchlist discovery'
          type: DEPENDENT
          key: tmdb.watchlist.movies.discovery
          delay: '0'
          description: 'Discovers all movies from the TMDB watchlist (page 1, up to 20 entries). Creates items and triggers for each discovered movie.'
          item_prototypes:
            - uuid: 6547f5ed19a04dc6be53d6bf6ac5e005
              name: 'TMDB: {#MOVIE_NAME} days until digital release'
              type: DEPENDENT
              key: 'tmdb.movie.days_until_digital_release[{#MOVIE_ID}]'
              delay: '0'
              value_type: FLOAT
              units: days
              description: 'Days remaining until the digital release for country {$TMDB.COUNTRY}. Negative values mean already released. The value -1 (displayed as "No release date set") means no digital release date is listed on TMDB.'
              valuemap:
                name: 'TMDB Days Until Release'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body.release_dates.results[?(@.iso_3166_1=="{$TMDB.COUNTRY}")].release_dates[?(@.type==4)].release_date.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!value || value === '0') return -1;
                      var d = new Date(value);
